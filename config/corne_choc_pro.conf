# Keyboard name shown to USB and Bluetooth hosts (max 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Kevin's Corne"

# -----------------------------------------------------------------------------
# Power & Sleep Management
# -----------------------------------------------------------------------------
# Enter idle after 3 minutes, deep sleep after 15 minutes
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Allow screen to blank on idle so the peripheral controller can sleep
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# -----------------------------------------------------------------------------
# RGB Underglow & Power Cut
# -----------------------------------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

# Start at 15% brightness to heavily cut battery draw
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=98

# CRITICAL: Turn off underglow power on battery, cut VCC rail when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_EXT_POWER=y

# -----------------------------------------------------------------------------
# Battery & Split Bluetooth Optimization
# -----------------------------------------------------------------------------
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Optimize BLE connection interval to prevent constant right-side retries
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6

# -----------------------------------------------------------------------------
# Layer Tap/Hold Timing
# -----------------------------------------------------------------------------
CONFIG_ZMK_HOLD_TAP_DEFAULT_TAPPING_TERM_MS=150
